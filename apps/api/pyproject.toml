[project]
name = "smart-intersection-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0"
]
vision = [
  "opencv-python-headless>=4.13.0.92",
  "ultralytics>=8.4.62"
]
simulation = [
  "sumolib>=1.27.0",
  "traci>=1.27.0"
]
ai = [
  "openai>=2.41.0",
  "pgvector>=0.4.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
